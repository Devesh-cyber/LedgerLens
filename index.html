<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>LedgerLens Upload Test</title>
    <style>
        body { font-family: sans-serif; padding: 2rem; max-width: 600px; }
        .box { border: 2px dashed #ccc; padding: 2rem; text-align: center; margin-bottom: 1rem; }
        button { padding: 10px 20px; cursor: pointer; background: #4f46e5; color: white; border: none; border-radius: 4px;}
        pre { background: #f8fafc; padding: 1rem; overflow-x: auto; border: 1px solid #e2e8f0; }
    </style>
</head>
<body>
    <h2>LedgerLens Batch Upload Test</h2>
    
    <div class="box">
        <input type="file" id="filePicker" multiple accept=".pdf,.jpg,.jpeg,.png">
        <button onclick="uploadFiles()">Test Upload</button>
    </div>

    <h4>Server Response:</h4>
    <pre id="responseOutput">Waiting for upload...</pre>

    <script>
        async function uploadFiles() {
            const fileInput = document.getElementById('filePicker');
            const output = document.getElementById('responseOutput');
            
            if (fileInput.files.length === 0) {
                output.textContent = "Please select at least one file.";
                return;
            }

            const formData = new FormData();
            for (const file of fileInput.files) {
                formData.append("files", file); // Must match the 'files' parameter in FastAPI
            }

            output.textContent = "Uploading to Supabase & Queuing...";

            try {
                const response = await fetch("http://127.0.0.1:8000/api/v1/invoices/upload", {
                    method: "POST",
                    body: formData
                });
                
                const data = await response.json();
                output.textContent = JSON.stringify(data, null, 2);
            } catch (error) {
                output.textContent = "Error connecting to server: " + error.message;
            }
        }
    </script>
</body>
</html>
